<template id="collection-page">
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Riftbound Card Collection</title>
		<link rel="stylesheet" href="css/font-faces.css">
		<link rel="stylesheet" href="css/style.css">
		<script type="module" src="lib/datastar.js"></script>
	</head>
	<body
		data-signals="{
			filters: {
				set: {require:[], exclude:[]},
				domain: {require: [], exclude: []},
				type: {require: [], exclude: []},
				tag: {require: [], exclude: []}
			}
		}"
		data-on:click="
			const button = evt.target.closest('button[data-id]');
			if (!button) {
				return;
			}
			const id = button.dataset.id, category = button.dataset.category;
			if ($filters[category].require.includes(id)) {
				$filters[category].require = $filters[category].require.filter(v => v !== id);
				if(button.dataset.statesCount === '3') {
					$filters[category].exclude = [...$filters[category].exclude, id];
				}
			}
			else if($filters[category].exclude.includes(id)) {
				$filters[category].exclude = $filters[category].exclude.filter(v => v !== id);
			}
			else {
				$filters[category].require = [...$filters[category].require, id];
			}
			@get('/cards')
		"
	>
		${makeSvgSymbols()}
		<main id="card-table" class="flex" data-flex="col fill">
			%{cardTable: string}
		</main>
	</body>
</html>
</template>

<template id="card-table">
	%{sortBar}
	<table>
		<thead><tr>
			<th>set</th><th>nr.</th><th>count</th><th>name</th>
			<th>[E]</th><th>[C]</th><th>[M]</th>
			<th>tags & keywords</th><th>description</th>
		</tr></thead>
		%{tbody}
	</table>
	<div data-flex-item="grow"></div>
	<footer class="sticky" data-sticky="bot">
		<section id="card-details" style="display: none;"
			data-signals:selected-card="-1"
			data-effect="if($selectedCard !== -1) {@get('/card-details/' + $selectedCard)}"
			data-show="$selectedCard !== -1"
		>
		</section>
		%{filterBar}
	</footer>
</template>

<template id="card-details">
	<figure class="card">
		<button popovertarget="card-dialog"><img src="%{url}" alt="%{altText}"></button>
		<figcaption>%{artistsLine}</figcaption>
	</figure>
	<ul class="flex" data-flex="col">%{versions}</ul>
	<button data-pos="absolute top right" data-variant="gold"
		data-on:click="$selectedCard = -1"
	>close</button>
	<dialog id="card-dialog" class="faux-modal" popover closedby="any">
		<button class="center-box" data-variant="transparent"
			popovertarget="card-dialog" popovertargetaction="hide"
		>
			<img src="%{url}" alt="%{altText}">
		</button>
	</dialog>
</template>

<template id="card-version">
	<li class="grid" data-flex="col">
		<span class="card-idx">%{index}</span>
		<button class="card-name">%{name}</button>
		<span>Rarity: %{rarityString} <img class="icon"
			src="icons/rarity/%{rarityName}.avif"
		></span>
		<span>%{artistLine}</span>
	</li>
</template>

<template id="sortbox">
	<div class="sortbox" draggable="true"
		data-on:dragstart="$_draggedIdx = %{idx:number}"
		data-on:dragend="@get('/cards')"
		data-on:dragover="evt.preventDefault()"
		data-on:dragenter="
			const targetValue = $sortOrder[%{idx}];
			$sortOrder[%{idx}] = $sortOrder[$_draggedIdx];
			$sortOrder[$_draggedIdx] = targetValue;
			$_draggedIdx = %{idx};
		"
	><span class="text-gradient" data-text="$sortOrder[%{idx}]"></span></div>
</template>

<template id="sticky-sort">
	<header id="sort-bar" class="sticky" data-sticky="top"
		data-signals:sort-order="[
			'set', 'domain', 'number', 'name', 'energy',
			'power', 'might', 'type', 'tags'
		]"
	>${
			makeSortbox(0) + makeSortbox(1) + makeSortbox(2) + makeSortbox(3) +
			makeSortbox(4) + makeSortbox(5) + makeSortbox(6) + makeSortbox(7) +
			makeSortbox(8)
		}
	</header>
</template>

<template id="cards-table-body">
	<tbody id="cards-table-body">%{rows}</tbody>
</template>

<template id="card-table-row">
	<tr id="card-%{cardId: number}"
		data-domain="%{domain}"
		data-rarity="%{rarity}"
		data-class:selected="$selectedCard === %{cardId}"
	>
		<td class="set-code">%{setCode}</td>
		<td class="card-idx">%{cardIndex}</td>
		<td class="collection-count">%{count: number}</td>
		<td><button
			class="card-name" data-on:click="$selectedCard = $selectedCard === %{cardId} ? -1 : %{cardId}"
		>%{name}</button></td>
		<td>%{energyHtml}</td>
		<td>%{powerHtml}</td>
		<td>%{mightHtml}</td>
		<td class="flex" data-flex="row justify-start align-center">
			<div class="type-row flex"
				data-flex="row nowrap justify-start align-center"
			>
				<span class="type-symbol"><svg class="inline-svg"
					viewBox="0 0 24 24"	width="24" height="24"
				>
					<use href="#symbol-%{typeSymbol}"></use>
				</svg></span>
				<mark class="badge small-caps-sans"	data-category="card-typing"
				>%{typeBadges}</mark>
			</div>
			<div class="badge-list">%{tagBadges}</div>
		</td>
		<td>%{description: string}</td>
	</tr>
</template>

<template id="short-name-and-subtitle">
	<span class="short-name">%{shortName}</span>
	<i class="small-caps">%{subtitle}</i>
</template>

<template id="energy-cost">
	<div class="energy-cost">%{energySymbol}</div>
</template>

<template id="power-cost">
	<div class="power-cost">%{powerSymbols}</div>
</template>

<template id="card-might">
	<div class="might-box">
		<div class="frame">
			<div class="mask"></div>
			<div class="base-might"><span>%{mightCount: number}</span></div>
		</div>
	</div>
</template>

<template id="badge">
	<mark class="badge small-caps-sans"	data-category="%{badgeType:'type'|'tag'}"
	>%{tag: string}</mark>
</template>

<template id="keyword">
	<span class="hoverable"><mark class="badge small-caps-sans"
		data-category="keyword"
		data-nested="%{isNested:boolean}"
		data-associated="%{isAssociated:boolean}"
		data-keyword="%{keyword}"
	><span class="kw-name">%{keyword}</span>%{param}%{cost}</mark
	>%{associated}%{reminder}</span>
</template>

<template id="span">
	<span class="%{classString}">%{textContent: string}</span>
</template>

<template id="anchor">
	<a href="%{href}"
		target="%{target:'_blank'|'_parent'|'_self'|'_top'}"
		%{attributes}
	>%{textContent: string}</a>
</template>

<template id="ability">
	<span class="ability hoverable">%{ability}%{reminder}</span>
</template>

<template id="activated-ability">
	<span class="ability hoverable"
		><span class="ability-cost">%{cost}</span
		>: <span class="ability-effect">%{effect}</span
	>%{reminder}</span>
</template>

<template id="infix-group">
	<span class="infix-group hoverable"><span class="lefthand"
	>%{lefthand}</span>%{operator}<span class="righthand"
	>%{righthand}</span>%{reminder}</span>
</template>

<template id="comma-list-item">
	<span class="comma-list-item">%{listItem}</span>
</template>

<template id="might-count">
	<span class="might-count"
		><span class="amount">%{sign}%{amount: number}</span
		><svg class="inline-svg" data-symbol="M" viewBox="0 0 24 24"
			width="24" height="24" role="img" aria-label="[M]"
		><use href="#symbol-M"></use></svg
	></span>
</template>

<template id="xp-count">
	<span class="xp-count">%{amount: number}%{sign: string} XP</span>
</template>

<template id="inline-orb-symbol">
	<span class="inline-svg" data-symbol="%{shorthand:string|number}">
		<svg class="rune-orb" viewBox="-1 -1 26 26"
			width="26" height="26"><use href="#rune-orb"></use></svg>
		<svg class="symbol-glyph" viewBox="-1 -1 26 26"
			width="26" height="26" role="img" aria-label="[%{shorthand}]"
		><use href="#symbol-%{shorthand}"></use>
		</svg>
	</span>
</template>

<template id="inline-symbol">
	<span class="inline-svg" data-symbol="%{shorthand:string|number}">
		<svg class="symbol-glyph" viewBox="-1 -1 26 26"
			width="26" height="26" role="img" aria-label="[%{shorthand}]"
		><use href="#symbol-%{shorthand}"></use>
		</svg>
	</span>
</template>

<template id="type-symbol">
	<span class="type-symbol"><svg viewBox="0 0 24 24" width="24" height="25"
		><use href="#symbol-%{type}"></use></svg
	></span>
</template>

<template id="reminder">
	<i class="reminder">%{content}</i>
</template>

<template id="card-description">
	<p class="description">%{content}</p>
</template>

<template id="filter-bar">
	<section id="filter-bar" class="flex" data-flex="row">
		%{setsPopup}
		%{domainsPopup}
		<input type="search" name="card-search"
			placeholder="Search card names or text"
			data-bind:search-term
			data-on:change="@get('/cards')"
		>
		%{typesPopup}
		%{tagsPopup}
	</section>
</template>

<template id="popup-menu">
	<div class="popup-menu" data-signals:_%{name}-popup="false">
		<button data-on:click="$_%{name}Popup = !$_%{name}Popup"
		><span class="text-gradient">%{name}</span></button>
		<div class="popup badge-list"
			style="display: none;"
			data-show="$_%{name}Popup"
		>%{content:string}</div>
	</div>
</template>

<template id="cycle-button">
	<button class="badge small-caps-sans" type="button"
		data-category="%{category}" data-id="%{id: number}"
		data-states-count="%{statesCount: number}"
		data-attr:data-state="
			$filters.%{category}.require.includes('%{id}') ? 'require' : (
				$filters.%{category}.exclude.includes('%{id}') ? 'exclude' : 'include'
			)
		"
	>%{content}</button>
</template>

<template id="toggle-button">
	<button class="badge small-caps-sans" type="button"
		data-category="%{category}" data-id="%{id:number}"
		data-attr:data-state="
			$filters.%{category}.require.includes('%{id}') ? 'require' : (
				$filters.%{category}.exclude.includes('%{id}') ? 'exclude' : 'include'
			)
		"
	>%{content}</button>
</template>

<template id="radio-filter">
	<fieldset class="radio-filter">
		<legend>%{name}</legend>
		<div class="radio-filter">
			<label for="%{name}-include">include</label>
			<input type="radio"
				name="filter-%{name}" id="%{name}-include" value="include"
			>

			<label for="%{name}-exclude">exclude</label>
			<input type="radio"
				name="filter-%{name}" id="%{name}-exclude" value="exclude"
			>

			<input type="radio" checked
				name="filter-%{name}" id="%{name}-unset" value="include"
			>
			<label for="%{name}-unset">unset</label>
		</div>
	</fieldset>
</template>

<template id="range-filter">
	<div id="range-%{name}">
		<label for="%{name}-min">min</label>
		<input type="range" id="%{name}-min" name="%{name}-min"
			data-bind:_%{name}-min
			min="%{min:number}" max="%{max:number}" value="%{min}"
		>
		<output for="%{name}-min" data-text="$%{name}Min"></output>
		<label for="%{name}-max">max</label>
		<input type="range" id="%{name}-max" name="%{name}-max"
			data-bind:_%{name}-max
			min="%{min}" max="%{max}" value="%{max}"
		>
		<output for="%{name}-min" data-text="$%{name}Max"></output>
	</div>
</template>
