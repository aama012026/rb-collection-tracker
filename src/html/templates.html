<template id="collection-page">
<!DOCTYPE html>
<html>
	<head>
		<title>Riftbound Card Collection</title>
		<link rel="stylesheet" href="css/font-faces.css">
		<link rel="stylesheet" href="css/style.css">
		<script type="module" src="lib/datastar.js"></script>
	</head>
	<body>
		<table>
			<thead>
			<tr>
				<th>set</th><th>nr.</th><th>count</th><th>name</th>
				<th>stats</th><th>tags & keywords</th><th>description</th>
			</tr>
			</thead>
			%{tbody: string}
		</table>
	</body>
</html>
</template>

<template id="cards-table-body">
	<tbody id="cards-table-body">
		%{rows: string}
	</tbody>
</template>

<template id="card-table-row">
	<tr id="%{cardId: number}" data-domain="%{domain: string}" data-rarity="%{rarity: string}">
		<td>%{setCode: string}</td>
		<td>%{cardNumber: number|bigint}</td>
		<td>%{count: number}</td>
		<td class="text-name">%{name: string}</td>
		<td class="stats">
			<span>%{energy: string}</span>
			<span>%{power: string}</span>
			<span>%{migth: string}</span>
		</td>
		<td>
			<span>
				<mark class="badge">%{types: string}</mark>
				<span>%{tags: string}</span>
			</span>
			<span>%{keywords: string}</span>
		</td>
		<td>%{description: string}</td>
	</tr>
</template>

<template id="tag">
	<mark class="badge">%{tag: string}</mark>
</template>

<template id="keyword">
	<mark class="badge" data-keyword="%{text: string}"></mark>
</template>

<template id="energy-svg">
	<img class="inline-svg" src="svg/energy/e%{energy: number}.svg" alt="%{energy} energy">
</template>

<template id="power-svg">
	<img class="inline-svg" src="svg/runes/[%{domain: string}].svg" alt="%{domain} power">
</template>

<template id="might-svg">
	<span>%{might: number}</span>
	<img class="inline-svg" src="svg/symbols/might.svg" alt="might."
</template>
