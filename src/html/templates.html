<template id="collection-page">
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Riftbound Card Collection</title>
		<link rel="stylesheet" href="css/font-faces.css">
		<link rel="stylesheet" href="css/style.css">
		<script type="module" src="lib/datastar.js"></script>
	</head>
	<body>
		${makeSvgSymbols()}
		${makeStickySort()}
		<table>
			<thead>
			<tr>
				<th>set</th><th>nr.</th><th>count</th><th>name</th>
				<th>stats</th><th>tags & keywords</th><th>description</th>
			</tr>
			</thead>
			%{tbody: string}
		</table>
		%{filterBar: string}
	</body>
</html>
</template>

<template id="sortbox">
	<div class="sortbox" draggable="true"
		data-on:dragstart="$_draggedIdx = %{idx:number}"
		data-on:dragend="@get('/cards')"
		data-on:dragover="evt.preventDefault()"
		data-on:dragenter="
			const targetValue = $sortOrder[%{idx}];
			$sortOrder[%{idx}] = $sortOrder[$_draggedIdx];
			$sortOrder[$_draggedIdx] = targetValue;
			$_draggedIdx = %{idx}
		"
	><span class="text-gradient" data-text="$sortOrder[%{idx}]"></span></div>
</template>

<template id="sticky-sort">
	<div id="sort-order" class="sticky" data-sticky="top"
		data-signals:sort-order="['set', 'domain', 'number', 'name', 'energy', 'power', 'might', 'type', 'tags']">${
			makeSortbox(0) + makeSortbox(1) + makeSortbox(2) + makeSortbox(3) +
			makeSortbox(4) + makeSortbox(5) + makeSortbox(6) + makeSortbox(7) +
			makeSortbox(8)
		}
	</div>
</template>

<template id="cards-table-body">
	<tbody id="cards-table-body">%{rows: string}</tbody>
</template>

<template id="card-table-row">
	<tr id="%{cardId: number}" data-domain="%{domain: string}" data-rarity="%{rarity: string}">
		<td class="set-code">%{setCode: string}</td>
		<td class="card-idx">%{cardIndex: string}</td>
		<td class="collection-count">%{count: number}</td>
		<td><div class="card-name">%{name: string}</div></td>
		<td class="stats">
			<span>%{energy: string}</span
			><span>%{power: string}</span
			><span>%{migth: string}</span>
		</td>
		<td><div class="badge-list">%{types: string}%{tags: string}</div></td>
		<td>%{description: string}</td>
	</tr>
</template>

<template id="short-name-and-subtitle">
	<span class="short-name">%{shortName: string}</span>
	<i class="small-caps">%{subtitle: string}</i>
</template>

<template id="badge">
	<mark class="badge small-caps-sans"	data-badge="%{badgeType:'type'|'tag'}"
	>%{tag: string}</mark>
</template>

<template id="keyword">
	<span class="hoverable"><mark class="badge small-caps-sans"
		data-badge="keyword"
		data-nested="%{isNested:boolean}"
		data-associated="%{isAssociated:boolean}"
		data-keyword="%{keyword: string}"
	><span class="kw-name">%{keyword}</span>%{param: string}%{cost: string}</mark
	>%{associated: string}%{reminder: string}</span>
</template>

<template id="span">
	<span class="%{classString: string}">%{textContent: string}</span>
</template>

<template id="ability">
	<span class="ability hoverable">%{ability: string}%{reminder: string}</span>
</template>

<template id="activated-ability">
	<span class="ability hoverable"
		><span class="ability-cost">%{cost:string}</span
		>: <span class="ability-effect">%{effect:string}</span
	>%{reminder:string}</span>
</template>

<template id="infix-group">
	<span class="infix-group hoverable"><span class="lefthand"
	>%{lefthand: string}</span>%{operator: string}<span class="righthand"
	>%{righthand: string}</span>%{reminder:string}</span>
</template>

<template id="comma-list-item">
	<span class="comma-list-item">%{listItem: string}</span>
</template>

<template id="might-count">
	<span class="might-count"
		><span class="amount">%{sign: string}%{amount: number}</span
		><svg class="inline-svg" data-symbol="M" viewBox="0 0 24 24"
			width="24" height="24" role="img" aria-label="[M]"
		><use href="#symbol-M"></use></svg
	></span>
</template>

<template id="xp-count">
	<span class="xp-count">%{amount: number}%{sign: string} XP</span>
</template>

<template id="inline-symbol">
	<span class="inline-svg" data-symbol="%{shorthand:string|number}">
		<svg class="rune-orb" viewBox="-1 -1 26 26"
			width="26" height="26"><use href="#rune-orb"></use></svg>
		<svg class="symbol-glyph" viewBox="-1 -1 26 26"
			width="26" height="26" role="img" aria-label="[%{shorthand}]"
		><use href="#symbol-%{shorthand}"></use>
		</svg>
	</span>
</template>

<template id="filter-bar">
	<div id="filter-bar" class="flex-row sticky" data-sticky="bot" data-signals="{
		setsFilters: %{setsFilters: string},
		domainsFilters: %{domainsFilters: string},
		typesFilters: %{typesFilters: string},
		tagsFilters: %{tagsFilters: string}
	}">
		%{setsPopup: string}
		%{domainsPopup: string}
		<input type="search" name="card-search"
			placeholder="Search card names or text"
		>
		%{typesPopup: string}
		%{tagsPopup: string}
	</div>
</template>

<template id="popup-menu">
	<div class="popup-menu" data-signals:_%{name:string}-popup="false">
		<button data-on:click="$_%{name}Popup = !$_%{name}Popup"
		><span class="text-gradient">%{name}</span></button>
		<div class="popup badge-list" data-show="$_%{name}Popup">%{content:string}</div>
	</div>
</template>

<template id="cycle-button">
	<button class="badge small-caps-sans" type="button"
		data-attr:data-state="%{stateSignal:string}"
		data-on:click="switch(%{stateSignal}) {
			case 'include': %{stateSignal} = 'require'; break;
			case 'require': %{stateSignal} = 'exclude'; break;
			case 'exclude': %{stateSignal} = 'include'; break;
		}"
	>%{buttonText: string}</button>
</template>

<template id="radio-filter">
	<fieldset class="radio-filter">
		<legend>%{name: string}</legend>
		<div class="radio-filter">
			<label for="%{name}-include">include</label>
			<input type="radio"
				name="filter-%{name}" id="%{name}-include" value="include"
			>

			<label for="%{name}-exclude">exclude</label>
			<input type="radio"
				name="filter-%{name}" id="%{name}-exclude" value="exclude"
			>

			<input type="radio" checked
				name="filter-%{name}" id="%{name}-unset" value="include"
			>
			<label for="%{name}-unset">unset</label>
		</div>
	</fieldset>
</template>

<template id="range-filter">
	<div id="range-%{name:string}">
		<label for="%{name}-min">min</label>
		<input type="range" id="%{name}-min" name="%{name}-min"
			data-bind:_%{name}-min
			min="%{min:number}" max="%{max:number}" value="%{min}"
		>
		<output for="%{name}-min" data-text="$%{name}Min"></output>
		<label for="%{name}-max">max</label>
		<input type="range" id="%{name}-max" name="%{name}-max"
			data-bind:_%{name}-max
			min="%{min}" max="%{max}" value="%{max}"
		>
		<output for="%{name}-min" data-text="$%{name}Max"></output>
	</div>
</template>

<template id="reminder">
	<i class="reminder">%{text: string}</i>
</template>

<template id="card-description">
	<p class="description">%{content: string}</p>
</template>
