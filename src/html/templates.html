<template id="collection-page">
<!DOCTYPE html>
<html>
	<head>
		<title>Riftbound Card Collection</title>
		<link rel="stylesheet" href="css/font-faces.css">
		<link rel="stylesheet" href="css/style.css">
		<script type="module" src="lib/datastar.js"></script>
	</head>
	<body>
		<table>
			<thead>
			<tr>
				<th>set</th><th>nr.</th><th>count</th><th>name</th>
				<th>stats</th><th>tags & keywords</th><th>description</th>
			</tr>
			</thead>
			%{tbody: string}
		</table>
	</body>
</html>
</template>

<template id="cards-table-body">
	<tbody id="cards-table-body">
		%{rows: string}
	</tbody>
</template>

<template id="card-table-row">
	<tr id="%{cardId: number}" data-domain="%{domain: string}" data-rarity="%{rarity: string}">
		<td>%{setCode: string}</td>
		<td>%{cardNumber: number|bigint}</td>
		<td>%{count: number}</td>
		<td class="text-name">%{name: string}</td>
		<td class="stats">
			<span>%{energy: string}</span>
			<span>%{power: string}</span>
			<span>%{migth: string}</span>
		</td>
		<td>
			<span>
				<mark class="badge" data-badge="type">%{types: string}</mark>
				<span>%{tags: string}</span>
			</span>
			<span>%{keywords: string}</span>
		</td>
		<td class="text-description">%{description: string}</td>
	</tr>
</template>

<template id="tag">
	<mark class="badge" data-badge="tag">%{tag: string}</mark>
</template>

<template id="keyword">
	<mark class="badge" data-badge="keyword" data-nested="%{isNested:boolean}"
		data-associated="%{isAssociated:boolean}" data-keyword="%{keyword: string}"
	>%{keyword}%{param: number|''}%{cost: string}
	</mark>
	%{associated: string}
	%{reminder: string}
</template>

<template id="ability">
	<span class="ability">%{ability: string}</span>
	%{reminder: string}
</template>

<template id="activated-ability">
	<span class="ability">
		<span class="ability-cost">%{cost:string}</span>
		:
		<span class="ability-effect">%{effect:string}</span>
	</span>
	%{reminder:string}
</template>

<template id="infix-group">
	<span class="lefthand">%{lefthand: string}</span>
	%{operator: string}
	<span class="righthand">%{righthand: string}</span>
	%{reminder:string}
</template>

<template id="comma-list-item">
	<span class="comma-list-item">%{listItem: string}</span>
</template>

<template id="might-count">
	<span class="might-count">
		<span class="amount">%{sign: string}%{amount: number}</span>
		<img class="inline-svg" src="svg/symbols/symbol-M.svg" alt="[M]"
	</span>
</template>

<template id="xp-count">
	<span class="xp-count">%{amount: number}%{sign: string} XP</span>
</template>

<template id="inline-symbol">
	<img class="inline-svg" src="svg/symbols/symbol-%{value: string|number}.svg" alt="[%{value}]">
</template>

<template id="reminder">
	<span class="reminder">(<i>%{text: string}</i>)</span>
</template>

<template id="card-description">
	<p class="description">%{content: string}</p>
</template>
